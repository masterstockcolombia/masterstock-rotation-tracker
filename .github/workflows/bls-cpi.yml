name: bls-cpi

on:
  schedule:
    # Cada lunes 09:30 UTC (30 min despues de census-marts, para minimizar
    # choque de push sobre el mismo archivo sqlite).
    - cron: "30 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BLS CPI scraper
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python -m scrapers.bls_cpi

      - name: Commit data if changed
        run: |
          git config user.name "masterstock-rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/masterstock_resale.sqlite
          git diff --staged --quiet || git commit -m "data: bls cpi snapshot $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
