name: bls-cpi

on:
  schedule:
    # Cada lunes 09:30 UTC (30 min despues de census-marts, para minimizar
    # choque de push sobre el mismo archivo sqlite).
    - cron: "30 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BLS CPI scraper
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python -m scrapers.bls_cpi

      - name: Commit data if changed (robusto a conflicto binario)
        run: bash scripts/commit_and_push.sh scrapers.bls_cpi "data: bls cpi snapshot $(date -u +%Y-%m-%d)"
