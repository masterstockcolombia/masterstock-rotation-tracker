name: craigslist

on:
  schedule:
    # Diario 17:00 UTC. Sin anti-bot fuerte confirmado en test real
    # (2026-09-03, 5/5 categorias OK, 16-129 listings por categoria).
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Craigslist scraper
        run: python -m scrapers.craigslist
        continue-on-error: true

      - name: Commit data if changed (robusto a conflicto binario)
        run: bash scripts/commit_and_push.sh scrapers.craigslist "data: craigslist snapshot $(date -u +%Y-%m-%d)"
