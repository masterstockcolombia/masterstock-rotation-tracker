name: ebay-sold

on:
  push:
    branches: [main]
    paths:
      - ".github/HEARTBEAT.md"
  schedule:
    # Diario 14:00 UTC. A diferencia de Census/BLS (mensual), sell-through
    # de eBay SI cambia dia a dia -- por eso corre diario, aunque hoy la
    # mayoria de corridas terminen "blocked" (ver README, seccion honestidad).
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run eBay sold scraper
        run: python -m scrapers.ebay_sold
        continue-on-error: true  # un bloqueo no es un fallo del workflow, es data (confidence=blocked)

      - name: Commit data if changed (robusto a conflicto binario)
        run: bash scripts/commit_and_push.sh scrapers.ebay_sold "data: ebay sold snapshot $(date -u +%Y-%m-%d)"
